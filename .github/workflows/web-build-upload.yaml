name: Build Movie App Monorepo and Upload to S3

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ARTIFACT_BUCKET: movie-app-builds-ayaz
      ARTIFACT_KEY_REPO: movies-app-build-latest.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install

      - name: Build monorepo
        run: pnpm build

      - name: Create tarball
        run: |
          tar -czf $ARTIFACT_KEY_REPO \
            apps \
            packages \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload tarball to S3
        run: |
          aws s3 cp $ARTIFACT_KEY_REPO s3://$ARTIFACT_BUCKET/$ARTIFACT_KEY_REPO
