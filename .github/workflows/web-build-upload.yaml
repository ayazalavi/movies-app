name: Build Next.js and NestJS and upload to S3

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ARTIFACT_BUCKET: movie-app-builds-ayaz
      ARTIFACT_KEY_WEB: web-build-latest.tar.gz
      ARTIFACT_KEY_API: api-build-latest.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install workspace deps only ONCE
      - name: Install workspace dependencies
        run: pnpm install

      ###################################
      # API BUILD + PACKAGE NODE_MODULES
      ###################################
      - name: Install API deps
        working-directory: apps/api
        run: pnpm install --prod

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Package API build
        working-directory: apps/api
        run: |
          tar -czf api-build.tar.gz dist node_modules package.json

      ###################################
      # WEB BUILD + PACKAGE NODE_MODULES
      ###################################
      - name: Install WEB deps
        working-directory: apps/web
        run: pnpm install --prod

      - name: Build Next.js
        working-directory: apps/web
        run: pnpm build

      - name: Package Next.js build
        working-directory: apps/web
        run: |
          tar -czf web-build.tar.gz .next node_modules package.json

      ###################################
      # UPLOAD ARTIFACTS
      ###################################
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload API build
        working-directory: apps/api
        run: aws s3 cp api-build.tar.gz s3://$ARTIFACT_BUCKET/$ARTIFACT_KEY_API

      - name: Upload Web build
        working-directory: apps/web
        run: aws s3 cp web-build.tar.gz s3://$ARTIFACT_BUCKET/$ARTIFACT_KEY_WEB
